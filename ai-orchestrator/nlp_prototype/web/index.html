<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تجربة الشات</title>
<style>
  :root {
    --bg: #f4f6f5; --panel: #ffffff; --text: #17201b; --muted: #66726b; --line: #e2e7e4;
    --accent: #1f8a5b; --accent-soft: #e3f3eb; --user: #1f8a5b; --user-text: #fff; --bot: #ffffff;
    --warn: #b7791f; --warn-soft: #fdf3e1; --danger: #c0392b; --income: #1f8a5b; --expense: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101513; --panel: #171e1b; --text: #e8eeea; --muted: #93a29a; --line: #26302b;
      --accent: #3ccf8e; --accent-soft: #1b3127; --user: #2a9d6a; --bot: #1d2622;
      --warn: #f0b955; --warn-soft: #3a2f19; --danger: #ff7b6b; --income: #3ccf8e; --expense: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "Segoe UI", Tahoma, Arial, sans-serif; }
  .app { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 1fr 320px; gap: 16px; height: 100vh; }
  @media (max-width: 820px) { .app { grid-template-columns: 1fr; height: auto; } .chat { height: 75vh; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .chat { display: flex; flex-direction: column; min-height: 0; }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  header h1 { font-size: 17px; margin: 0; }
  header small { color: var(--muted); }
  .messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-start; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-end; background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.error { border-color: var(--danger); color: var(--danger); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--text); }
  .chip.low { background: var(--warn-soft); color: var(--warn); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  details { margin-top: 8px; font-size: 12px; color: var(--muted); }
  details pre { direction: ltr; text-align: left; white-space: pre-wrap; margin: 6px 0 0; }
  .examples { padding: 10px 18px 0; display: flex; gap: 6px; flex-wrap: wrap; }
  .examples button { font-size: 13px; padding: 4px 10px; border-radius: 999px; color: var(--muted); }
  form { display: flex; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); margin-top: 10px; }
  input { flex: 1; font: inherit; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); min-width: 0; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .hint { padding: 0 18px; color: var(--warn); font-size: 13px; min-height: 0; }
  aside { padding: 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  aside h2 { font-size: 15px; margin: 0; }
  .totals { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .total { background: var(--bg); border-radius: 10px; padding: 8px; text-align: center; }
  .total b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
  .amt, .chip.num { direction: ltr; unicode-bidi: isolate; }
  .total span { font-size: 12px; color: var(--muted); }
  .ledger { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .ledger li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
  .ledger .amt { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ledger .income { color: var(--income); } .ledger .expense { color: var(--expense); }
  .ledger small { color: var(--muted); display: block; }
  .ledger button { padding: 2px 8px; font-size: 12px; }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <section class="panel chat">
    <header>
      <div><h1>المساعد المالي</h1><small>نسخة تجريبية · الموديل شغال على جهازك</small></div>
      <button id="reset" type="button">محادثة جديدة</button>
    </header>
    <div class="messages" id="messages"></div>
    <div class="examples" id="examples"></div>
    <div class="hint" id="hint"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="اكتب مصروف أو دخل… مثلاً: دفعت 120 أكل">
      <button class="primary" type="submit">إرسال</button>
    </form>
  </section>
  <aside class="panel">
    <h2>المعاملات المسجلة</h2>
    <div class="totals">
      <div class="total"><b id="tIncome">0</b><span>دخل</span></div>
      <div class="total"><b id="tExpense">0</b><span>مصروفات</span></div>
      <div class="total"><b id="tBalance">0</b><span>الرصيد</span></div>
    </div>
    <ul class="ledger" id="ledger"></ul>
  </aside>
</div>
<script>
const EXAMPLES = ["انا اشتريت كوتشي نايك من مول مصر ب 1200 جنيه", "قبضت المرتب ١٥٠٠٠", "طلبت بيتزا من طلبات ب 320",
  "دفعت ميتين جنيه بنزين", "اشتريت جاكيت جديد", "سلفت صاحبي ٥٠٠", "dafa3t 60 koshary", "الحلاق ١٥٠", "ازيك"];
const TYPE_AR = {expense: "مصروف", income: "دخل", savings: "ادخار", transfer: "تحويل"};
const CAT_AR = {Food: "أكل", Transport: "مواصلات", Housing: "سكن", Utilities: "فواتير", Subscriptions: "اشتراكات",
  Entertainment: "خروج وترفيه", Shopping: "مشتريات", Health: "صحة", Education: "تعليم", Debt: "أقساط وديون", Other: "أخرى",
  Salary: "مرتب", Freelance: "فريلانس", Gift: "هدية", Refund: "مرتجع", Savings: "ادخار", Transfer: "تحويل", Lending: "سلفة"};
const $ = id => document.getElementById(id);
let pendingDraft = null;  // a needs_info draft waiting for the user's amount
let ledger = load();

function load() { try { return JSON.parse(localStorage.getItem("ledger") || "[]"); } catch { return []; } }
function save() { try { localStorage.setItem("ledger", JSON.stringify(ledger)); } catch {} }
const fmt = (n, cur) => n.toLocaleString("en-US", {maximumFractionDigits: 2}) + (cur === "USD" ? " $" : " ج");

function bubble(cls, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  $("messages").appendChild(el);
  $("messages").scrollTop = $("messages").scrollHeight;
  return el;
}

function chip(parent, text, low) {
  const c = document.createElement("span");
  c.className = "chip" + (low ? " low" : "");
  c.textContent = text;
  parent.appendChild(c);
}

function button(parent, label, primary, onClick) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = label;
  if (primary) b.className = "primary";
  b.onclick = onClick;
  parent.appendChild(b);
  return b;
}

async function ask(payload) {
  try {
    const res = await fetch("/api/message", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)});
    const out = await res.json();
    if (out.error) throw new Error(out.error);
    renderBot(out);
  } catch (e) {
    bubble("bot error", "حصلت مشكلة في السيرفر: " + e.message);
  }
}

function renderBot(out) {
  const el = bubble("bot", out.reply);
  const d = out.extracted_data || {};
  pendingDraft = null; $("hint").textContent = "";
  if (d.type) {
    const chips = document.createElement("div"); chips.className = "chips"; el.appendChild(chips);
    chip(chips, TYPE_AR[d.type] || d.type);
    if (d.amount != null) chip(chips, fmt(d.amount, d.currency));
    if (d.category) chip(chips, (CAT_AR[d.category] || d.category) + (d.category_confidence != null ? ` ${Math.round(d.category_confidence * 100)}%` : ""), d.category_confidence < 0.5);
    if (d.item) chip(chips, "🛍 " + d.item);
    if (d.item_type_ar) chip(chips, "🏷 " + d.item_type_ar);
    if (d.merchant) chip(chips, "📍 " + d.merchant);
    if (d.date) chip(chips, "📅 " + d.date);
    if (d.person) chip(chips, "👤 " + d.person);
  }
  const actions = document.createElement("div"); actions.className = "actions";
  if (out.status === "confirmed") {
    addToLedger(d);  // complete messages are saved directly; wrong entries can be deleted from the list
  } else if (out.status === "needs_info" && out.category_options) {
    out.category_options.forEach(o => button(actions, o.label, o.value === d.category, () => {
      [...actions.children].forEach(b => b.disabled = true);
      bubble("user", o.label);
      ask({draft: d, category: o.value});
    }));
  } else if (out.status === "needs_info") {
    pendingDraft = d;
    $("hint").textContent = "الرسالة الجاية هتتحسب كإجابة على سؤال المبلغ.";
  }
  if (actions.children.length) el.appendChild(actions);
  const det = document.createElement("details");
  det.innerHTML = "<summary>البيانات المستخرجة (JSON)</summary><pre></pre>";
  det.querySelector("pre").textContent = JSON.stringify({status: out.status, ...d}, null, 2);
  el.appendChild(det);
  $("messages").scrollTop = $("messages").scrollHeight;
}

function addToLedger(d) {
  ledger.unshift({id: Date.now(), type: d.type, amount: d.amount, currency: d.currency, category: d.category,
                  label: d.item || d.merchant || CAT_AR[d.category] || ""});
  save(); renderLedger();
}

function renderLedger() {
  const ul = $("ledger"); ul.innerHTML = "";
  let income = 0, expense = 0;
  ledger.forEach(t => {
    const egp = t.currency === "USD" ? 0 : t.amount;  // demo totals count EGP only
    if (t.type === "income") income += egp; else if (t.type === "expense") expense += egp;
    const li = document.createElement("li");
    const info = document.createElement("div");
    info.textContent = t.label || TYPE_AR[t.type];
    const sub = document.createElement("small"); sub.textContent = `${TYPE_AR[t.type]} · ${CAT_AR[t.category] || t.category}`;
    info.appendChild(sub);
    const amt = document.createElement("span");
    amt.className = "amt " + t.type; amt.textContent = (t.type === "income" ? "+" : "−") + fmt(t.amount, t.currency);
    li.append(info, amt);
    button(li, "حذف", false, () => { ledger = ledger.filter(x => x.id !== t.id); save(); renderLedger(); });
    ul.appendChild(li);
  });
  if (!ledger.length) ul.innerHTML = '<li class="empty" style="border:0">لسه مفيش معاملات. جرّب مثال من تحت الشات.</li>';
  $("tIncome").textContent = income.toLocaleString("en-US");
  $("tExpense").textContent = expense.toLocaleString("en-US");
  $("tBalance").textContent = (income - expense).toLocaleString("en-US");
}

function send(text) {
  text = text.trim();
  if (!text) return;
  bubble("user", text);
  ask(pendingDraft ? {draft: pendingDraft, text} : {text});
}

$("form").onsubmit = e => { e.preventDefault(); send($("input").value); $("input").value = ""; $("input").focus(); };
$("reset").onclick = () => { $("messages").innerHTML = ""; pendingDraft = null; $("hint").textContent = ""; greet(); };
EXAMPLES.forEach(x => button($("examples"), x, false, () => send(x)));
function greet() { bubble("bot", "أهلاً 👋 ابعتلي أي مصروف أو دخل بالمصري أو الفرانكو أو الإنجليزي، وأنا أطلّع المبلغ والفئة وأسجله. ولو ناقص حاجة هسألك."); }
greet(); renderLedger(); $("input").focus();
</script>
</body>
</html>
